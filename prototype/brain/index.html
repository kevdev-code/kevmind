<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Brain · KevMind prototype</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='14' fill='%237c5cf0'/><circle cx='11' cy='13' r='3' fill='white'/><circle cx='21' cy='13' r='3' fill='white'/><circle cx='16' cy='21' r='3' fill='white'/></svg>" />
  <script>
    try { const t = localStorage.getItem('kevmind.theme'); if (t === 'dark' || t === 'light') document.documentElement.dataset.theme = t; } catch {}
  </script>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="top">
    <div class="brand">
      <span class="logo"><svg viewBox="0 0 32 32" width="20" height="20" aria-hidden="true"><circle cx="16" cy="16" r="14" fill="var(--accent-fill)"/><circle cx="11" cy="13" r="3" fill="#fff"/><circle cx="21" cy="13" r="3" fill="#fff"/><circle cx="16" cy="21" r="3" fill="#fff"/><path d="M11 13L21 13L16 21Z" stroke="#fff" stroke-width="1.2" fill="none"/></svg>KevMind</span>
      <div class="seg" role="group" id="viewGroup">
        <button type="button" data-view="live" data-i18n="viewLive"></button>
        <button type="button" data-view="memory" data-i18n="viewMemory"></button>
        <button type="button" data-view="brain" data-i18n="viewBrain"></button>
      </div>
      <span class="proto" data-i18n="prototype"></span>
    </div>
    <div class="top-right">
      <div class="seg icons" role="group" id="themeGroup">
        <button type="button" data-theme-set="system"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8M12 17v4"/></svg></button>
        <button type="button" data-theme-set="dark"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg></button>
        <button type="button" data-theme-set="light"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></button>
      </div>
      <div class="seg" role="group" id="langGroup">
        <button type="button" data-lang="en">EN</button>
        <button type="button" data-lang="es">ES</button>
      </div>
    </div>
  </header>

  <main class="brain-view" id="brainView">
    <aside class="rail" id="rail">
      <details class="filters" id="filters" open>
        <summary data-i18n="filters"></summary>
        <div class="search">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
          <input type="search" id="search" autocomplete="off" spellcheck="false" data-i18n-placeholder="search" />
          <kbd aria-hidden="true">/</kbd>
        </div>
        <ul class="results" id="results" aria-live="polite"></ul>

        <section>
          <h2 class="head" data-i18n="projects"></h2>
          <ul class="checks" id="projectList"></ul>
        </section>
        <section>
          <h2 class="head" data-i18n="nodeTypes"></h2>
          <ul class="checks" id="typeList"></ul>
        </section>
        <section>
          <h2 class="head" data-i18n="edgeTypes"></h2>
          <ul class="checks" id="edgeList"></ul>
        </section>
        <section>
          <h2 class="head" data-i18n="regions"></h2>
          <ul class="legend regions" id="regionLegend"></ul>
        </section>
        <section>
          <h2 class="head" data-i18n="colors"></h2>
          <ul class="legend" id="kindLegend"></ul>
        </section>
        <section class="proto-box">
          <h2 class="head"><span data-i18n="prototype"></span> <small data-i18n="synthetic"></small></h2>
          <div class="row">
            <button type="button" class="btn" id="replayBtn"></button>
            <span class="muted" id="replayClock"></span>
          </div>
          <div class="row">
            <span class="muted" data-i18n="nodes"></span>
            <div class="seg" role="group" id="sizeGroup">
              <button type="button" data-size="0">~600</button>
              <button type="button" data-size="3000">~3,000</button>
            </div>
          </div>
        </section>
      </details>
    </aside>

    <section class="well" id="well" aria-labelledby="wellTitle">
      <canvas id="brain" role="img"></canvas>
      <div class="labels" id="labels" aria-hidden="true"></div>
      <div class="chips" id="chips" aria-hidden="true"></div>

      <div class="overlay tl">
        <div class="titlerow">
          <h1 class="title" id="wellTitle" data-i18n="viewBrain"></h1>
          <span class="muted" id="counts"></span>
        </div>
        <p class="hint" id="hint" data-i18n="hint"></p>
      </div>
      <div class="overlay tr">
        <button type="button" class="switch" role="switch" id="animSwitch" aria-checked="true"><span></span><b data-i18n="anim"></b></button>
      </div>

      <aside class="card focus" id="focusCard" hidden aria-live="polite"></aside>

      <div class="overlay bl">
        <div class="trace" id="trace">
          <div class="trace-top"><span class="dot"></span><b id="traceState"></b><small data-i18n="trace"></small></div>
          <div class="trace-legend" id="traceLegend"></div>
          <canvas id="eeg" role="img"></canvas>
        </div>
        <div class="seg camera" role="group" data-i18n-label="camera">
          <button type="button" id="zoomIn" data-i18n-label="zoomIn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button>
          <button type="button" id="zoomOut" data-i18n-label="zoomOut"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M5 12h14"/></svg></button>
          <button type="button" id="fitBtn" data-i18n="fit"></button>
          <button type="button" id="relayoutBtn" data-i18n="relayout"></button>
          <button type="button" id="followBtn" aria-pressed="false" data-i18n="follow"></button>
          <button type="button" id="rotateBtn" aria-pressed="false" data-i18n="rotate"></button>
        </div>
      </div>

      <div class="overlay br now" id="now">
        <div class="now-top">
          <span class="status" id="nowStatus"><span class="dot"></span><span id="nowStatusText"></span></span>
          <span class="nowproj" id="nowProject"></span>
        </div>
        <ul class="agents" id="agentList"></ul>
      </div>

      <div class="tip" id="tip" hidden></div>
      <p class="nogl" id="noGl" hidden data-i18n="noWebgl"></p>
    </section>
  </main>

  <main class="elsewhere" id="elsewhere" hidden>
    <p data-i18n="elsewhere"></p>
  </main>

  <script type="module" src="app.js"></script>
</body>
</html>
