<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>KevMind</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='14' fill='%237c6cf0'/><circle cx='11' cy='13' r='3' fill='white'/><circle cx='21' cy='13' r='3' fill='white'/><circle cx='16' cy='21' r='3' fill='white'/></svg>" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="top">
    <div class="brand">
      <svg viewBox="0 0 32 32" width="22" height="22" aria-hidden="true"><circle cx="16" cy="16" r="14" fill="var(--accent)"/><circle cx="11" cy="13" r="3" fill="#fff"/><circle cx="21" cy="13" r="3" fill="#fff"/><circle cx="16" cy="21" r="3" fill="#fff"/><path d="M11 13L21 13L16 21Z" stroke="#fff" stroke-width="1.2" fill="none"/></svg>
      <span>KevMind</span>
      <div class="views" role="group" aria-label="View">
        <button type="button" data-view="live" data-i18n="viewLive"></button>
        <button type="button" data-view="memory" data-i18n="viewMemory"></button>
      </div>
    </div>
    <div class="top-right">
      <div class="conn" id="conn"><span class="dot"></span><span id="connText" data-i18n="connecting"></span></div>
      <div class="lang" role="group" aria-label="Language">
        <button type="button" data-lang="en">EN</button>
        <button type="button" data-lang="es">ES</button>
      </div>
    </div>
  </header>

  <main class="layout">
    <aside class="panel sessions">
      <h2><span data-i18n="sessions"></span> <small data-i18n="last24h"></small></h2>
      <select id="projectFilter" class="project-filter"></select>
      <ul id="sessionList"></ul>
      <p class="empty" id="noSessions" data-i18n-html="noSessions"></p>
    </aside>

    <section class="center">
      <div class="panel now" id="now">
        <div class="now-head">
          <div>
            <div class="project" id="nowProject">—</div>
            <div class="muted"><span id="nowCwd"></span><code class="model" id="nowModel" hidden></code><span class="loading" id="nowLoading" data-i18n="loadingHistory" hidden></span></div>
          </div>
          <span class="status" id="nowStatus">—</span>
        </div>
        <div class="stats">
          <div><b id="stAgents">0</b><span data-i18n="activeAgents"></span></div>
          <div><b id="stActions">0</b><span data-i18n="actions"></span></div>
          <div><b id="stPrompts">0</b><span data-i18n="messages"></span></div>
          <div><b id="stTime">0 min</b><span data-i18n="duration"></span></div>
          <div><b id="stTokens">—</b><span data-i18n="tokensInOut"></span></div>
          <div><b id="stCache">—</b><span data-i18n="cacheRW"></span></div>
        </div>
      </div>

      <div class="panel">
        <h2><span data-i18n="agents"></span> <small data-i18n="agentsSub"></small></h2>
        <div id="gantt" class="gantt"></div>
      </div>

      <div class="panel feed-panel">
        <h2><span data-i18n="activity"></span> <small data-i18n="live"></small>
          <label class="toggle"><input type="checkbox" id="showThinks" checked /> <span data-i18n="showThinks"></span></label>
        </h2>
        <ol id="feed" class="feed"></ol>
      </div>
    </section>

    <aside class="right">
      <div class="panel">
        <h2 data-i18n="alerts"></h2>
        <ul id="alerts" class="alerts"></ul>
        <p class="empty small" id="noAlerts" data-i18n="noAlerts"></p>
      </div>
      <div class="panel">
        <h2><span data-i18n="files"></span> <small data-i18n="mostTouched"></small></h2>
        <ul id="files" class="files"></ul>
      </div>
      <div class="panel">
        <h2 data-i18n="tools"></h2>
        <table class="tools">
          <thead><tr><th data-i18n="tool"></th><th data-i18n="uses"></th><th data-i18n="errors"></th><th data-i18n="avg"></th></tr></thead>
          <tbody id="tools"></tbody>
        </table>
      </div>
    </aside>
  </main>

  <!-- Memory tab: read-only report on what Claude Code and Serena remember about a project -->
  <main class="memory-view" id="memoryView" hidden>
    <aside class="panel mem-projects">
      <h2 data-i18n="memProjects"></h2>
      <ul id="memProjectList"></ul>
      <details id="memOtherWrap" hidden>
        <summary><span data-i18n="memOther"></span> <small id="memOtherCount"></small></summary>
        <ul id="memOtherList"></ul>
      </details>
      <p class="empty small" id="memNoProjects" data-i18n="memNoProjects" hidden></p>
    </aside>
    <section class="mem-main">
      <div class="panel">
        <div class="now-head">
          <div>
            <div class="project" id="memName">—</div>
            <div class="muted" id="memRoot"></div>
          </div>
          <span class="muted" id="memUpdated"></span>
        </div>
        <div id="memBudget" class="budget"></div>
      </div>
      <div class="panel">
        <h2 data-i18n="memIssues"></h2>
        <div id="memProblems"></div>
      </div>
      <div class="panel">
        <h2 data-i18n="memInstructions"></h2>
        <div id="memInstructions" class="mem-table"></div>
      </div>
      <div class="panel">
        <h2><span data-i18n="memClaude"></span> <small id="memClaudeDir"></small></h2>
        <div id="memNotes" class="mem-table"></div>
      </div>
      <div class="panel">
        <h2><span data-i18n="memSerena"></span> <small id="memSerenaDir"></small></h2>
        <div id="memSerena" class="mem-table"></div>
      </div>
    </section>
  </main>

  <script src="i18n.js"></script>
  <script src="app.js"></script>
  <script src="memory.js"></script>
</body>
</html>
